 [build-system]
 requires = ["setuptools", "wheel"]
 build-backend = "setuptools.build_meta"
 
 [project]
 name = "neurogenesis"
 version = "0.1.0"
 description = "Event-driven agent core with streaming and observability"
 readme = "README.md"
 requires-python = ">=3.11"
 dependencies = [
   "fastapi",
   "uvicorn",
   "pydantic",
   "typer",
   "httpx",
   "python-dotenv",
 ]
 
 [project.optional-dependencies]
 dev = [
   "pytest",
   "pytest-asyncio",
   "ruff",
   "black",
   "mypy",
 ]
 observability = [
   "opentelemetry-api",
   "opentelemetry-sdk",
   "opentelemetry-instrumentation-fastapi",
   "opentelemetry-exporter-otlp",
   "prometheus-client",
 ]
 
 [project.scripts]
 ng = "neurogenesis.cli.main:app"
 
 [tool.setuptools]
 package-dir = {"" = "src"}
 
 [tool.setuptools.packages.find]
 where = ["src"]
 
 [tool.ruff]
 line-length = 100
 target-version = "py311"
 select = ["E", "F", "I", "UP", "B"]
 
 [tool.mypy]
 python_version = "3.11"
 warn_unused_ignores = true
 ignore_missing_imports = true
 disallow_untyped_defs = false
 
 [tool.pytest.ini_options]
 asyncio_mode = "auto"
 testpaths = ["tests"]
