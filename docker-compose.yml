 version: "3.9"
 
 services:
   api:
     build:
       context: .
       dockerfile: docker/api.Dockerfile
    ports:
      - "6800:8000"
     environment:
       NG_LOG_LEVEL: INFO
       NG_SAFE_MODE: "false"
     depends_on:
       - postgres
       - redis
       - qdrant
   console:
     build:
       context: .
       dockerfile: docker/console.Dockerfile
    ports:
      - "6300:3000"
   postgres:
     image: timescale/timescaledb:latest-pg14
     environment:
       POSTGRES_USER: neuro
       POSTGRES_PASSWORD: neuro
       POSTGRES_DB: neurogenesis
    ports:
      - "6543:5432"
   redis:
     image: redis:latest
     ports:
       - "6379:6379"
   qdrant:
     image: qdrant/qdrant:latest
     ports:
       - "6333:6333"
